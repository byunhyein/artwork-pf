<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HYE!N의 개인 작업 아카이브" />
  <title>Artwork Archive — HYE!N</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#archive">본문으로 건너뛰기</a>
  <main class="artwork-page desktop-wallpaper" id="archive">
    <div class="desktop-frame">
      <header class="menu-bar">
        <div class="menu-bar__inner">
          <div class="brand-group"><span class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></span><a href="#archive" class="brand">HYE!N</a></div>
          <nav class="menu-nav" aria-label="주요 메뉴"><a href="#archive" aria-current="page">Index</a><a href="#works">Works</a><a href="#about">About</a></nav>
          <div class="system-bar" aria-label="시스템 상태">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="5.8"></circle><path d="m15.2 15.2 5 5"></path></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.4a13.6 13.6 0 0 1 18 0M6.2 12.8a8.7 8.7 0 0 1 11.6 0M9.5 16.2a3.8 3.8 0 0 1 5 0"></path><circle cx="12" cy="19" r="1"></circle></svg>
          <svg class="battery" viewBox="0 0 28 18" aria-hidden="true"><rect x="1" y="2" width="22" height="14" rx="2"></rect><path d="M25 6v6"></path><rect x="3.5" y="4.5" width="15" height="9" rx="1" class="battery-fill"></rect></svg>
          <time class="live-clock" aria-live="off"></time>
          </div>
        </div>
      </header>
      <section class="archive-hero" aria-labelledby="archive-title">
        <div class="hero-copy"><p class="archive-label">PERSONAL ARCHIVE&nbsp;&nbsp; 2021 — 2026</p><h1 id="archive-title">ARTWORK<br />ARCHIVE</h1><p class="hero-message">Drawn things,<br />little moments,<br />and characters.</p></div>
        <nav class="folder-grid" id="works" aria-label="작품 카테고리">
          <a class="folder folder--person" href="#person" data-category="person"><span class="folder-tab" aria-hidden="true"></span><span class="folder-face"><em>01</em></span><strong>PERSON</strong><small>인물 일러스트</small></a>
          <a class="folder folder--character" href="#character" data-category="character"><span class="folder-tab" aria-hidden="true"></span><span class="folder-face"><em>02</em></span><strong>CHARACTER</strong><small>캐릭터 작업</small></a>
          <a class="folder folder--drawing" href="#drawing" data-category="drawing"><span class="folder-tab" aria-hidden="true"></span><span class="folder-face"><em>03</em></span><strong>DRAWING</strong><small>드로잉 · 스케치</small></a>
          <a class="folder folder--object" href="#object" data-category="object"><span class="folder-tab" aria-hidden="true"></span><span class="folder-face"><em>04</em></span><strong>OBJECT</strong><small>음식 · 소품</small></a>
        </nav>
      </section>
      <div class="landscape" aria-hidden="true"><div class="cloud cloud--left"></div><div class="cloud cloud--right"></div><div class="hill hill--back"></div><div class="hill hill--front"></div><div class="tree tree--one"></div><div class="tree tree--two"></div><div class="tree tree--three"></div><div class="house"><i></i><b></b></div></div>
      <nav class="dock artwork-dock" aria-label="Artwork 카테고리">
        <a class="dock-item" href="#archive" data-dock-target="archive" aria-label="ARCHIVE"><img src="images/dock/archive.png" alt="" /></a>
        <a class="dock-item" href="#person" data-dock-target="person" aria-label="PERSON"><img src="images/dock/person.png" alt="" /></a>
        <a class="dock-item" href="#character" data-dock-target="character" aria-label="CHARACTER"><img src="images/dock/character.png" alt="" /></a>
        <a class="dock-item" href="#drawing" data-dock-target="drawing" aria-label="DRAWING"><img src="images/dock/drawing.png" alt="" /></a>
        <a class="dock-item" href="#object" data-dock-target="object" aria-label="OBJECT"><img src="images/dock/object.png" alt="" /></a>
        <span class="dock-divider" aria-hidden="true"></span>
        <a class="dock-item" href="#random" data-dock-target="random" aria-label="RANDOM"><img src="images/dock/random.png" alt="" /></a>
        <span class="dock-active-indicator" aria-hidden="true"></span>
      </nav>
    </div>
    <footer>© 2026 HYEIN. ALL RIGHTS RESERVED.</footer>
  </main>
  <section class="archive-modal" aria-labelledby="finder-title" aria-hidden="true" hidden>
    <div class="archive-modal__backdrop" data-modal-close></div>
    <div class="finder-window" role="dialog" aria-modal="true" aria-labelledby="finder-title" tabindex="-1">
      <header class="finder-window__header">
        <div class="finder-controls" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="finder-title-group">
          <span class="finder-folder-icon" aria-hidden="true"></span>
          <div><h2 id="finder-title">01. PERSON</h2><p class="finder-count">0 items</p></div>
        </div>
        <div class="finder-actions" aria-label="보기 설정">
          <button class="finder-view is-active" type="button" data-view="grid" aria-label="격자 보기" aria-pressed="true"><span aria-hidden="true">⊞</span></button>
          <button class="finder-view" type="button" data-view="list" aria-label="목록 보기" aria-pressed="false"><span aria-hidden="true">☷</span></button>
          <button class="finder-close" type="button" aria-label="팝업 닫기" data-modal-close>×</button>
        </div>
      </header>
      <div class="finder-window__body">
        <nav class="finder-sidebar" aria-label="작품 분류">
          <button type="button" data-gallery-category="all"><span aria-hidden="true">⌂</span>All</button>
          <button type="button" data-gallery-category="person"><span aria-hidden="true">♙</span>Person</button>
          <button type="button" data-gallery-category="character"><span aria-hidden="true">♧</span>Character</button>
          <button type="button" data-gallery-category="drawing"><span aria-hidden="true">▱</span>Drawing</button>
          <button type="button" data-gallery-category="object"><span aria-hidden="true">◇</span>Object</button>
        </nav>
        <div class="finder-gallery-wrap">
          <div class="finder-gallery" role="list" aria-live="polite"></div>
        </div>
      </div>
      <div class="artwork-lightbox" aria-hidden="true" hidden>
        <button class="artwork-lightbox__backdrop" type="button" aria-label="큰 이미지 닫기" data-lightbox-close></button>
        <button class="artwork-lightbox__nav artwork-lightbox__nav--previous" type="button" aria-label="이전 이미지" data-lightbox-previous>‹</button>
        <figure class="artwork-lightbox__content">
          <img class="artwork-lightbox__image" src="" alt="" />
          <figcaption class="artwork-lightbox__caption"></figcaption>
          <button class="artwork-lightbox__close" type="button" aria-label="큰 이미지 닫기" data-lightbox-close>×</button>
        </figure>
        <button class="artwork-lightbox__nav artwork-lightbox__nav--next" type="button" aria-label="다음 이미지" data-lightbox-next>›</button>
      </div>
    </div>
  </section>
</body>
</html>
